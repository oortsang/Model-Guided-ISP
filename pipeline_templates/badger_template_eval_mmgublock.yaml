# Config file for converting scattering object files to measurement misfit gradients
---
definitions:
  command: python eval_MMGUBlock.py
  template: "<<rlc-repo>>/<<base-template-eval-mmgu=pipeline_templates/base_template_eval_mmgublock.jinja>>"
  copy_to_item: true
  default_arguments:
    log_dir: <<logs-rel-dir=logs/mmg_pipeline/mmg_solver>>
    partition: <<partition="gpu">>
    num_nodes: 1
    num_gpu: <<num-gpu=1>>
    num_cpu: <<num-cpu=4>>
    exclude_node: <<exclude-node="">>
    mem: <<mem="25G">>
    job_walltime: "<<time-limit=4:00:00>>"
    mail_type: <<mail-type=end>>
    mail_user: <<mail-user="">>
  submission:
    !SLURMQueue
      jobs_folder: <<jobs-rel-dir=jobs/mmg_pipeline/mmg_solver>>
      job_name_key: log_name
      fake_submission: <<badger-fake-submission=false>>
      overwrite_scripts: <<badger-overwrite-scripts=false>>
  constants:
    rlc_repo_dir: &RLC_REPO_DIR "<<rlc-repo>>"
    ref_dataset_dir: &REF_DATASET_DIR '"<<rlc-repo>>/<<ref-dataset-rel-dir=dataset>>"'
    input_pred_scobj_dir: &INPUT_PRED_SCOBJ_DIR '"<<rlc-repo>>/<<input-pred-scobj-dir>>"'
    input_pred_mmg_dir:   &INPUT_PRED_MMG_DIR   '"<<rlc-repo>>/<<input-pred-mmg-dir>>"'

arguments:
  - !Scalar
    name: ref_dataset_dir
    prefix: "--ref_data_dir_base"
    value: *REF_DATASET_DIR
    metadata_rules: [!SaveValueInMetadata {path: ref_dataset_dir} ]
  - !Scalar
    name: input_pred_scobj_dir
    prefix: "--input_pred_scobj_dir"
    value: *INPUT_PRED_SCOBJ_DIR
    metadata_rules: [ !SaveValueInMetadata {path: input_pred_scobj_dir} ]
  - !Scalar
    name: input_pred_mmg_dir
    prefix: "--input_pred_mmg_dir"
    value: *INPUT_PRED_MMG_DIR
    metadata_rules: [ !SaveValueInMetadata {path: input_pred_mmg_dir} ]
  - !Scalar { name: freq_idx, prefix: "--freq_idx", value: <<freq-idx=1>> }
  - !Scalar
    name: dset_names
    prefix: "--dset_names"
    value: "<<eval-dset-list>>" # expect this to be a list
    metadata_rules: [ !SaveValueInMetadata { path: dset_names } ]


  # Weights and biases settings
  - !Scalar { name: debug, value: "--debug", prefix: "" }
  - !Scalar { name: wandb_entity,  value: "<<wandb-entity=recursive-linearization>>", prefix: "--wandb_entity" }
  - !Scalar { name: wandb_project, value: "<<wandb-project>>", prefix: "--wandb_project" }
  - !Scalar { name: wandb_mode, value: "<<wandb-mode=online>>", prefix: "--wandb_mode" }

  # Data/general settings that don't need to be saved
  - !Scalar { name: seed, prefix: "--seed",value: <<seed>> }
  - !Scalar { name: log_batch_size, prefix: "--log_batch_size", value: <<log-batch-size>> }


  # - !Scalar { name: log_train_subset_frac, prefix: "--log_train_subset_frac", value: <<log-train-subset-frac>>  }
  # - !Scalar { name: selection_field, prefix: "--selection_field", value: <<selection-field>> }
  # - !Scalar { name: selection_mode, prefix: "--selection_mode", value: <<selection-mode>> }

  # - !Scalar
  #   name: num_train
  #   prefix: "--truncate_num_train"
  #   value: <<num-train>>
  #   metadata_rules: [ !SaveValueInMetadata { path: num_train } ]
  # - !Scalar
  #   name: num_val
  #   prefix: "--truncate_num_val"
  #   value: <<num-val>>
  #   metadata_rules: [ !SaveValueInMetadata { path: num_val } ]
  # - !Scalar
  #   name: num_test
  #   prefix: "--truncate_num_test"
  #   value: <<num-test>>
  #   metadata_rules: [ !SaveValueInMetadata { path: num_test } ]

  - !Scalar
    name: truncate_nums
    prefix: "--truncate_nums"
    value: "<<eval-dset-nums>>" # expect a list
    metadata_rules: [ !SaveValueInMetadata { path: truncate_nums } ]

  ##### Data settings #####
  - !Range
    name: data_input_nus
    values: [ "<<nu-sf>>" ] # keep as strings to have good control over decimal points later
    prefix: "--data_input_nus"
    metadata_rules: [ !SaveValueInMetadata { path: data_input_nus }]

  # Mostly use this for tracking the setup info
  - !Range
    name: train_targets
    prefix: "--use_targets"
    values: [<<train-targets="smoothed", "original">>]
    metadata_rules: [ !SaveValueInMetadata {path: train_targets} ]
  - !Range
    name: eval_targets
    prefix: "--use_targets"
    values: [<<eval-targets="smoothed", "original">>]
    metadata_rules: [ !SaveValueInMetadata {path: eval_targets} ]

  - !Range
    name: noise_to_signal_ratio
    values: [ "<<noise-level=0>>" ]
    prefix: "--noise_to_signal_ratio"
    metadata_rules: [ !SaveValueInMetadata {path: noise_to_signal_ratio } ]

  # Set up noise seeds
  - !Scalar
    name: use_noise_seed
    value: "<<use-noise-seed=true>>"
    prefix: "--use_noise_seed"
  - !Scalar
    name: noise_seeds
    value: "$((<<noise-seeds>>))"
    prefix: "--noise_seeds"
  # - !Scalar
  #   name: noise_seed_train
  #   value: "$((<<noise-seed-train>>))"
  #   prefix: "--noise_seed_train"
  # - !Scalar
  #   name: noise_seed_val
  #   value: "$((<<noise-seed-val>>))"
  #   prefix: "--noise_seed_val"
  # - !Scalar
  #   name: noise_seed_test
  #   value: "$((<<noise-seed-test>>))"
  #   prefix: "--noise_seed_test"

  # ##### Architectural parameters #####
  # - !Range
  #   name: n_cnn_layers_2d
  #   prefix: "--n_cnn_layers_2d"
  #   values: [ <<n-cnn-layers-2d>> ]
  #   metadata_rules: [ !SaveValueInMetadata { path: n_cnn_layers_2d } ]

  # - !Range
  #   name: n_cnn_channels_2d
  #   prefix: "--n_cnn_channels_2d"
  #   values: [ <<n-cnn-channels-2d>> ]
  #   metadata_rules: [ !SaveValueInMetadata { path: n_cnn_channels_2d } ]

  # - !Range
  #   name: kernel_size_2d
  #   prefix: "--kernel_size_2d"
  #   values: [ <<kernel-size-2d>> ]
  #   metadata_rules: [ !SaveValueInMetadata { path: kernel_size_2d } ]


  # ##### Optimization parameters #####
  # - !Scalar { name: n_epochs, prefix: "--n_epochs", value: <<n-epochs>> }
  # - !Scalar { name: n_epochs_per_log, prefix: "--n_epochs_per_log", value: <<n-epochs-per-log>> }
  # - !Scalar { name: freq_lvl, prefix: "--freq_lvl", value: <<freq-lvl=1>> }
  # - !Scalar { name: freq_idx, prefix: "--freq_idx", value: <<freq-idx=1>> }
  # - !Scalar { name: lr_decrease_factor, prefix: "--lr_decrease_factor", value: <<lr-decrease-factor=1>> }

  # - !Range
  #   name: batch_size
  #   prefix: "--batch_size"
  #   values: [ <<batch-size>> ]
  #   metadata_rules: [ !SaveValueInMetadata { path: batch_size } ]

  # - !Range
  #   name: lr_init_base
  #   prefix: "--lr_init_base"
  #   values: [ <<lr-init-base>> ]
  #   metadata_rules: [ !SaveValueInMetadata { path: lr_init_base } ]

  # - !Range
  #   name: eta_min_base
  #   prefix: "--eta_min_base"
  #   values: [ <<eta-min-base>> ]
  #   metadata_rules: [ !SaveValueInMetadata { path: eta_min_base } ]

  # - !Range
  #   name: weight_decay_base
  #   prefix: "--weight_decay_base"
  #   values: [ <<weight-decay-base>> ]
  #   metadata_rules: [ !SaveValueInMetadata { path: weight_decay_base } ]


  ##### Model/Input/Output/Job/Log names #####
  # Model name
  - !Scalar
    name: model_base_name
    value: "<<model-base-name>>"
    metadata_rules: [ !SaveValueInMetadata { path: model_base_name } ]

  # - !ArgumentFromMetadata
  #   name: model_hyperparams
  #   # format_rule: "arch_..._opt_..."
  #   format_rule: "<<model-hyperparam-name-format>>"
  #   sources: [
  #     # Architecture Hyperparameters
  #     { path: n_cnn_layers_2d, destination: ncl2 },
  #     { path: n_cnn_channels_2d, destination: ncc2 },
  #     { path: kernel_size_2d, destination: k2d },
  #     # Optimization Hyperparameters
  #     { path: lr_init_base, destination: lr },
  #     { path: weight_decay_base, destination: wd },
  #     { path: batch_size, destination: bs },
  #   ]
  #   metadata_rules: [ !SaveValueInMetadata { path: model_hyperparams } ]

  # - !ArgumentFromMetadata
  #   name: model_extras
  #   format_rule: "<<model-extras-name-format>>"
  #   sources: [
  #     { path: model_base_name, destination: model_base_name },
  #     { path: data_input_nus, destination: nus },
  #     # Other values
  #     { path: noise_to_signal_ratio, destination: ntsr },
  #     { path: num_train, destination: ntrain},
  #     { path: train_targets, destination: tt},
  #     { path: eval_targets, destination: et},
  #   ]
  #   metadata_rules: [ !SaveValueInMetadata { path: model_extras } ]

  - !ArgumentFromMetadata
    name: model_name
    format_rule: "<<output-common-name-format>>"
    # format_rule: "<<model-name-format>>"
    sources: [
      { path: model_base_name, destination: model_base_name },
      { path: noise_to_signal_ratio, destination: ntsr },
      { path: train_targets, destination: tt},
      { path: eval_targets, destination: et},
    ]
    metadata_rules: [ !SaveValueInMetadata { path: model_name } ]

  # Input directories handled above
  # - !Scalar { name: input_pred_scobj_dir, prefix: "--input_pred_scobj_dir", value: "<<input-pred-scobj-dir>>" }
  # - !Scalar { name: input_pred_mmg_dir, prefix: "--input_pred_mmg_dir", value: "<<input-pred-mmg-dir>>" }

  # Output paths/directories
  - !Scalar { name: output_pred_save, prefix: "--output_pred_save", value: "<<output-pred-save>>" }
  - !Scalar { name: output_pred_shard_size, prefix: "--output_pred_shard_size", value: "<<output-pred-shard-size=1000>>" }

  - !Scalar { name: in_central_summary_fp, prefix: "--in_central_summary_fp", value: '"<<in-central-summary-fp>>"' }
  - !Scalar { name: out_central_summary_fp, prefix: "--out_central_summary_fp", value: '"<<out-central-summary-fp>>"' }
  - !Scalar { name: central_model_fp, prefix: "--central_model_fp", value: '"<<central-model-fp>>"' }

  - !ArgumentFromMetadata
    name: train_results_fp
    prefix: "--train_results_fp"
    format_rule: '"<<train-results-format>>"'
    sources: [
      { path: model_hyperparams, destination: model_hyperparams},
      { path: model_extras, destination: model_extras},
      { path: model_base_name, destination: model_base_name },
      { path: model_name, destination: model_name },
      { path: data_input_nus, destination: nus },
    ]

  # - !ArgumentFromMetadata
  #   name: model_weights_dir
  #   prefix: "--model_weights_dir"
  #   format_rule: '"<<model-weights-format>>"'
  #   sources: [
  #     { path: model_hyperparams, destination: model_hyperparams},
  #     { path: model_base_name, destination: model_base_name },
  #     { path: model_name, destination: model_name },
  #     { path: data_input_nus, destination: nus },
  #   ]

  - !ArgumentFromMetadata
    name: output_pred_dir
    prefix: "--output_pred_dir"
    format_rule: '"<<output-pred-format>>"'
    sources: [
      # { path: model_hyperparams, destination: model_hyperparams},
      # { path: model_base_name, destination: model_base_name },
      { path: model_name, destination: model_name },
      { path: data_input_nus, destination: nus },

      { path: train_targets, destination: tt},
      { path: eval_targets, destination: et},
    ]

  # Job+Log names
  - !ArgumentFromMetadata
    name: job_name
    format_rule: "<<job-name-format>>"
    sources: [
      # { path: model_hyperparams, destination: model_hyperparams},
      # { path: model_extras, destination: model_extras},
      { path: model_base_name, destination: model_base_name },
      { path: model_name, destination: model_name },
      { path: data_input_nus, destination: nus },
    ]
    metadata_rules: [ !SaveValueInMetadata { path: job_name } ]

  - !ArgumentFromMetadata
    name: log_name
    format_rule: "<<log-name-format={model_name}>>"
    sources: [
      # { path: model_hyperparams, destination: model_hyperparams},
      # { path: model_extras, destination: model_extras},
      { path: model_base_name, destination: model_base_name },
      { path: model_name, destination: model_name },
      { path: data_input_nus, destination: nus },
    ]
    metadata_rules: [ !SaveValueInMetadata { path: log_name } ]
