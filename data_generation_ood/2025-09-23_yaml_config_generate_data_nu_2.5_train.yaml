# Have the mapping to fill in for 2025-07-23_yaml_template_generate_measurement_files.yaml
template-file: data_generation_ood/2025-07-23_yaml_template_generate_measurement_files.yaml
templates-rel-dir: data_generation_ood
out-file:      data_generation_ood/2025-09-23_config_generate_data_nu_2.5_train.yaml

# Make sure to check these!
run-date: 2025-09-23
nu-sf: '2.5'

wandb-project: "2025-07-23_gen_data_low_constrast"

# General info
rlc-repo: /home-nfs/oortsang/rlc-repo
predictions-rel-dir: rlc_data/predictions
dset: train
input-scobj-dir: dataset
output-meas-dir: 2025-08-25_dataset_more_freqs

# Slurm/badger stuff
logs-rel-dir: logs/gen_data_low_contrast/
partition: "low-gpu,gpu,willett-gpu"
jobs-rel-dir: jobs/gen_data_low_contrast
badger-fake-submission: false
badger-overwrite-scripts: true

# File settings
num-samples: 10000
samples-per-chunk: 250
write-every-n: 10

job-name-format: "2025-08-25_dataset_more_freqs_<<dset>>_measurements_nu_{nu_sf}_meas_{input_label}"

# Solver settings
rho-max: 0.575
solver-type: ls # hps
rtol: 1e-4
linsys-solver: bicgstab
use-half-grid: "true"
half-grid-tol-ratio: 0.5
max-iter: 1000000
bicgstab-restart: 1000
restart: 1000 # this is meant for gmres

# hps-l: 4
# hps-p: 16
# hps-comp-domain-factor: 1
