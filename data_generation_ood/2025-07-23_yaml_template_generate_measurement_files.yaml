# Variant of the yaml_template_run_pde_solver.yaml
# The original uses "!FilesInFolder", but ideally I would like
# to create slurm scripts without requiring the scattering files
# to already be there...
# So, here we take an alternate approach: pass the chunk size
# information and pre-compute what the files names will be...

---
definitions:
  command: python generate_measurement_files.py
  template: "<<rlc-repo>>/<<templates-rel-dir=dg_scripts>>/\
    2025-07-23_base_template_generate_measurement_files.jinja"

  copy_to_item: true

  default_arguments:
    log_dir: <<logs-rel-dir=logs/mpsr/run_pde_solver>>
    partition: <<partition="gpu">>
    num_nodes: 1
    num_gpu: <<num-gpu=1>>
    num_cpu: <<num-cpu=4>>
    exclude_node: <<exclude-node="">>
    mem: <<mem="25G">>
    job_walltime: "<<time-limit=4:00:00>>"
    mail_type: <<mail-type=end>>
    mail_user: <<mail-user="">>

  submission:
    !SLURMQueue
      jobs_folder: <<jobs-rel-dir=jobs/mpsr/run_pde_solver>>
      job_name_key: job_name
      fake_submission: <<badger-fake-submission=false>>
      overwrite_scripts: <<badger-overwrite-scripts=false>>

  constants:
    scobj_dir: &SCOBJ_DIR "<<rlc-repo>>/<<predictions-rel-dir>>/\
      <<input-scobj-dir>>/<<dset>>_scattering_objs"
    sd_mat_dir: &SD_MAT_DIR "<<rlc-repo>>/\
      <<hps-sd-mat-dir=rlc_data/HPS_SD_matrices>>"
    output_dir: &OUTPUT_DIR "<<rlc-repo>>/<<predictions-rel-dir>>/\
      <<output-meas-dir>>"

arguments:
  - !Scalar { name: output_dir, value: *OUTPUT_DIR }
  - !Scalar
    name: scobj_dir,
    value: *SCOBJ_DIR
    metadata_rules: [ !SaveValueInMetadata {path: scobj_dir}]
  - !Scalar { name: sd_mat_dir, value: *SD_MAT_DIR }

  - !Scalar { name: solver_type, value: <<solver-type=ls>>, prefix: "--solver_type" }
  - !Scalar { name: hps_l, value: <<hps_l=4>>, prefix: "--hps_l" }
  - !Scalar { name: hps_p, value: <<hps_p=16>>, prefix: "--hps_p" }
  - !Scalar
      name: hps_comp_domain_factor
      value: <<hps-comp-domain-factor=2>>
      prefix: "--hps_comp_domain_factor"

  - !Scalar { name: batch_size, value: <<solver-batch-size=100>>, prefix: "--batch_size" }
  - !Scalar { name: receiver_radius, value: 100, prefix: "--receiver_radius" }
  - !Scalar { name: start_idx, value: "0", prefix: "--start_idx" }
  - !Scalar { name: create_n_samples, value: -1, prefix: "--create_n_samples" }
  - !Scalar { name: write_every_n, value: <<write-every-n=10>>, prefix: "--write_every_n" }
  - !Scalar { name: debug, value: "--debug", prefix: "" }
  - !Scalar { name: wandb_entity,  value: "<<wandb-entity=recursive-linearization>>", prefix: "--wandb_entity" }
  - !Scalar { name: wandb_project, value: "<<wandb-project>>", prefix: "--wandb_project" }
  - !Scalar { name: wandb_mode, value: "<<wandb-mode=online>>", prefix: "--wandb_mode" }

  - !Scalar { name: rtol, value: "<<rtol=1e-2>>", prefix: "--rtol" }
  - !Scalar { name: linsys_solver, value: "<<linsys-solver>>", prefix: "--linsys_solver" }
  - !Scalar { name: use_half_grid, value: "<<use-half-grid=false>>", prefix: "--use_half_grid" }
  - !Scalar { name: half_grid_tol_ratio, value: <<half-grid-tol-ratio=0.5>>, prefix: "--half_grid_tol_ratio" }
  - !Scalar { name: max_iter, value: <<max-iter=500>>, prefix: "--max_iter" }
  - !Scalar { name: restart, value: <<restart=10>>, prefix: "--restart" }
  - !Scalar { name: bicgstab_restart, value: <<bicgstab-restart=1000>>, prefix: "--bicgstab_restart" }

  - !Range
    name: nu_source_freq
    values: [ <<nu-sf>> ] # keep as strings to have good control over decimal points later
    prefix: "--nu_source_freq"
    metadata_rules: [ !SaveValueInMetadata { path: nu_sf }]

  - !Range
    name: chunk_start_idx
    start: <<first-chunk-start=0>>
    end:  <<num-samples>>
    step: <<samples-per-chunk=250>>
    metadata_rules: [ !SaveValueInMetadata {path: input_label}]

  - !ArgumentFromMetadata
    name: input_fp
    format_rule: "{scobj_dir}/scattering_objs_{input_label}.h5"
    sources: [
      {path: scobj_dir, destination: scobj_dir},
      {path: input_label, destination: input_label},
    ]

  # - !FilesInFolder
  #   name: input_fp
  #   folder: *SCOBJ_DIR
  #   regexp_filter: "scattering_objs_([0-9]+).h5"
  #   metadata_rules:
  #     - !ExtractFromFileNameRegexpMetadata
  #       paths: [ input_label ]

  - !ArgumentFromMetadata
    name: job_name
    format_rule: "<<job-name-format>>"
    sources: [
      {path: input_label, destination: input_label},
      {path: nu_sf, destination: nu_sf},
    ]
    metadata_rules: [ !SaveValueInMetadata { path: job_name } ]

  - !ArgumentFromMetadata
    name: output_fp
    prepend: *OUTPUT_DIR
    # prefix: "--output_fp"
    format_rule: "<<dset>>_measurements_nu_{nu_sf}/measurements_{input_label}.h5"
    sources: [
      {path: job_name, destination: job_name},
      {path: input_label, destination: input_label},
      {path: nu_sf, destination: nu_sf}
    ]