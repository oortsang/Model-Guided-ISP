---
# 2026-08-05: the measurement-generation config no longer needs to match this
# 500-sample shard size. generate_measurement_files.py now reads a global
# sample-index slice via --input_dir/--global_idx_start/--global_n_samples
# (src.data.data_io.load_single_dir_slice), so its own samples-per-chunk
# (e.g. 250, sized for cluster walltime limits) is fully decoupled from
# these scattering-object shards.
definitions:
  command: python generate_scattering_files.py
  template: template_generate_scattering_files.jinja

  copy_to_item: true

  default_arguments:
    mem: "20G"
    logs_folder: logs/consolidated_dataset_generation
    partition: "cpu"

  submission:
    !SLURMQueue
      jobs_folder: jobs
      job_name_key: job_name
      fake_submission: false
      overwrite_scripts: true

  constants:
    dir_out: &DIR_OUT "/home-nfs/oortsang/rlc-repo/consolidated_dataset/train_scattering_objs"

arguments:
  - !Scalar { name: n_samples, value: 500, prefix: "--n_samples" }
  - !Scalar { name: n_pixels, value: 192, prefix: "--n_pixels" }
  - !Scalar { name: contrast, value: 2.0, prefix: "--contrast" }
  - !Scalar { name: background_max_radius, value: 0.4, prefix: "--background_max_freq" }
  - !Scalar { name: background_max_freq, value: 4.0, prefix: "--background_max_freq" }
  - !Scalar { name: spatial_domain_max, value: 0.5, prefix: "--spatial_domain_max" }
  - !Scalar { name: gaussian_lpf_param, value: 16.0, prefix: "--gaussian_lpf_param" }
  - !Scalar { name: rho_max, value: 0.575, prefix: "--rho_max" }
  - !Scalar { name: wandb_entity, value: "recursive-linearization", prefix: "--wandb_entity" }
  - !Scalar { name: wandb_project, value: "2026-08-05_consolidated_dataset_scattering_objs", prefix: "--wandb_project" }
  - !Scalar { name: wandb_mode, value: "offline", prefix: "--wandb_mode" }

  - !Range
    name: seed
    start: 0
    end: 10_000
    step: 500
    prefix: "--seed"
    metadata_rules: [ !SaveValueInMetadata { path: seed } ]

  - !ArgumentFromMetadata
    name: job_name
    format_rule: "train_scattering_objs_{seed}"
    sources: [ {path: seed, destination: seed} ]
    metadata_rules: [ !SaveValueInMetadata { path: job_name } ]

  - !ArgumentFromMetadata
    name: output_fp
    # IMPORTANT: filename must be exactly "scattering_objs_{seed}.h5" --
    # generate_measurement_files.py's !FilesInFolder / the measurement
    # template's format_rule ("{scobj_dir}/scattering_objs_{input_label}.h5")
    # hardcodes this prefix regardless of job_name, so it must match here too.
    format_rule: "scattering_objs_{seed}.h5"
    prepend: *DIR_OUT
    prefix: "--output_fp"
    sources: [ {path: seed, destination: seed} ]
