---
# Consolidated scattering-object generation for the test split. See
# config_generate_train_scattering_files.yaml for the full rationale.
#
# Seeds are UNCHANGED from dg_scripts/config_generate_test_scattering_files.yaml
# (seed = seed_a + 532), n_samples kept at 500 to preserve bit-identical
# q_cart objects. samples-per-chunk: 500 in the companion measurement config
# matches these shard boundaries.
definitions:
  command: python generate_scattering_files.py
  template: template_generate_scattering_files.jinja

  copy_to_item: true

  default_arguments:
    mem: "20G"
    logs_folder: logs/gen_data_main
    partition: "cpu"

  submission:
    !SLURMQueue
      jobs_folder: jobs/gen_data_main
      job_name_key: job_name
      fake_submission: false
      overwrite_scripts: true

  constants:
    dir_out: &DIR_OUT "/home-nfs/oortsang/rlc-repo/consolidated_dataset/test_scattering_objs"

arguments:
  - !Scalar { name: n_samples, value: 500, prefix: "--n_samples" }
  - !Scalar { name: n_pixels, value: 192, prefix: "--n_pixels" }
  - !Scalar { name: contrast, value: 2.0, prefix: "--contrast" }
  - !Scalar { name: background_max_radius, value: 0.4, prefix: "--background_max_freq" }
  - !Scalar { name: background_max_freq, value: 4.0, prefix: "--background_max_freq" }
  - !Scalar { name: spatial_domain_max, value: 0.5, prefix: "--spatial_domain_max" }
  - !Scalar { name: gaussian_lpf_param, value: 16.0, prefix: "--gaussian_lpf_param" }
  - !Scalar { name: rho_max, value: 0.575, prefix: "--rho_max" }
  - !Scalar { name: wandb_entity, value: "recursive-linearization", prefix: "--wandb_entity" }
  - !Scalar { name: wandb_project, value: "2026-08-05_consolidated_dataset_scattering_objs", prefix: "--wandb_project" }
  - !Scalar { name: wandb_mode, value: "offline", prefix: "--wandb_mode" }

  - !Range
    name: seed_a
    start: 0
    end: 1_000
    step: 500
    # prefix: "--seed"
    metadata_rules: [ !SaveValueInMetadata { path: seed_a } ]

  - !ArgumentFromMetadata
    name: seed
    prefix: "--seed"
    format_rule: "{seed_a}+532"
    sources: [ {path: seed_a, destination: seed_a}]

  - !ArgumentFromMetadata
    name: job_name
    format_rule: "test_scattering_objs_{seed_a}"
    sources: [ {path: seed_a, destination: seed_a} ]
    metadata_rules: [ !SaveValueInMetadata { path: job_name } ]

  - !ArgumentFromMetadata
    name: output_fp
    # IMPORTANT: filename must be exactly "scattering_objs_{seed_a}.h5" --
    # the measurement template hardcodes this prefix regardless of job_name.
    format_rule: "scattering_objs_{seed_a}.h5"
    prepend: *DIR_OUT
    prefix: "--output_fp"
    sources: [ {path: seed_a, destination: seed_a} ]
